<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXRAY 3D // Studio Email Dispatcher &amp; Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #0038FF;
      --brand-hover: #0026b3;
      --accent: #CCFF00;
      --bg-dark: #0b1120;
      --sidebar-bg: #0f172a;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f8fafc;
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* Left Panel: Controls */
    .controls-panel {
      width: 440px;
      min-width: 420px;
      background: #ffffff;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-shadow: 4px 0 24px rgba(0,0,0,0.04);
      z-index: 20;
    }
    .panel-header {
      padding: 20px 24px;
      background: var(--bg-dark);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--brand);
    }
    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .brand-title span { color: var(--brand); }
    .status-badge {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      background: rgba(204, 255, 0, 0.15);
      color: var(--accent);
      border: 1px solid rgba(204, 255, 0, 0.4);
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .panel-content {
      padding: 24px;
      overflow-y: auto;
      flex-grow: 1;
    }
    .section-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: block;
    }
    .template-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }
    .tmpl-btn {
      background: #f1f5f9;
      border: 1.5px solid transparent;
      border-radius: 10px;
      padding: 12px 10px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tmpl-btn:hover {
      background: #e2e8f0;
    }
    .tmpl-btn.active {
      background: #ffffff;
      border-color: var(--brand);
      box-shadow: 0 4px 14px rgba(0, 56, 255, 0.15);
    }
    .tmpl-btn .icon { font-size: 18px; display: block; margin-bottom: 4px; }
    .tmpl-btn .title { font-size: 12px; font-weight: 700; color: var(--text-main); line-height: 1.3; }
    .tmpl-btn .sender { font-size: 10px; color: var(--brand); font-weight: 600; margin-top: 2px; }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 13px;
      color: var(--text-main);
      background: #ffffff;
      transition: border 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(0, 56, 255, 0.1);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .panel-footer {
      padding: 20px 24px;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-action-primary {
      background: var(--brand);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0, 56, 255, 0.25);
      transition: all 0.2s;
    }
    .btn-action-primary:hover {
      background: var(--brand-hover);
      transform: translateY(-1px);
    }
    .btn-action-secondary {
      background: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-action-secondary:hover {
      background: #e2e8f0;
    }

    /* Right Panel: Live Preview */
    .preview-panel {
      flex-grow: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #e2e8f0;
    }
    .preview-bar {
      padding: 12px 24px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .gmail-sender-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .gmail-sender-badge {
      background: #0f172a;
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 11px;
    }
    .preview-container {
      flex-grow: 1;
      padding: 30px;
      overflow-y: auto;
      display: flex;
      justify-content: center;
    }
    .email-frame {
      width: 100%;
      max-width: 660px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
      overflow: hidden;
      height: fit-content;
      margin-bottom: 40px;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10b981;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
      display: none;
      z-index: 100;
      animation: fadeIn 0.3s forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Controls Panel -->
  <div class="controls-panel">
    <div class="panel-header">
      <div class="brand-title">NEX<span>RAY</span> // EMAIL HUB</div>
      <span class="status-badge">&bull; LIVE SUITE</span>
    </div>

    <div class="panel-content">
      <span class="section-label">Select Email Template</span>
      <div class="template-selector">
        <button class="tmpl-btn active" onclick="setTemplate('advance', this)">
          <span class="icon">💰</span>
          <div class="title">Advance Invoice</div>
          <div class="sender">From: info@nexray.in</div>
        </button>
        <button class="tmpl-btn" onclick="setTemplate('delivery', this)">
          <span class="icon">📦</span>
          <div class="title">Asset Delivery</div>
          <div class="sender">From: dev@nexray.in</div>
        </button>
        <button class="tmpl-btn" onclick="setTemplate('quote', this)">
          <span class="icon">📑</span>
          <div class="title">Scope &amp; Quote</div>
          <div class="sender">From: info@nexray.in</div>
        </button>
        <button class="tmpl-btn" onclick="setTemplate('feedback', this)">
          <span class="icon">⭐</span>
          <div class="title">Print Check-in</div>
          <div class="sender">From: support@nexray.in</div>
        </button>
      </div>

      <span class="section-label">Client &amp; Order Variables</span>
      <div class="form-group">
        <label>Client / Patron Name</label>
        <input type="text" id="var-client-name" value="Respected Patron" oninput="renderEmail()">
      </div>
      <div class="form-group">
        <label>Project / Figurine Title</label>
        <input type="text" id="var-project-title" value="Lord Kodanda Rama 6-inch 3D Sculpt" oninput="renderEmail()">
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Total Price (&#8377;)</label>
          <input type="text" id="var-total-price" value="1,500" oninput="renderEmail()">
        </div>
        <div class="form-group">
          <label>Advance Received (&#8377;)</label>
          <input type="text" id="var-advance-paid" value="707" oninput="renderEmail()">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Balance Due (&#8377;)</label>
          <input type="text" id="var-balance-due" value="793" oninput="renderEmail()">
        </div>
        <div class="form-group">
          <label>UPI VPA ID</label>
          <input type="text" id="var-upi-id" value="info@nexray.in" oninput="renderEmail()">
        </div>
      </div>

      <div class="form-group">
        <label>Deliverable / Cloud Download Link</label>
        <input type="text" id="var-download-link" value="https://drive.google.com/" oninput="renderEmail()">
      </div>

      <div class="form-group">
        <label>Custom Technical Note</label>
        <textarea id="var-custom-note" rows="2" oninput="renderEmail()">100% Watertight manifold mesh. Contact flat base at Z=0.00mm. Print tested for Bambu Lab & Anycubic 8K.</textarea>
      </div>
    </div>

    <div class="panel-footer">
      <button class="btn-action-primary" onclick="copyFormattedEmail()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
        Copy Formatted Email (Ctrl+V into Gmail)
      </button>
      <button class="btn-action-secondary" onclick="copyRawHtml()">
        Copy Raw HTML Source Code
      </button>
    </div>
  </div>

  <!-- Preview Panel -->
  <div class="preview-panel">
    <div class="preview-bar">
      <div class="gmail-sender-indicator">
        <span>Recommended Sender:</span>
        <span class="gmail-sender-badge" id="recommended-sender">Info Nexray &lt;info@nexray.in&gt;</span>
      </div>
      <div style="font-size: 12px; color: var(--text-muted); font-weight: 600;">
        Interactive Live Outlook &amp; Gmail Compatibility Mode
      </div>
    </div>

    <div class="preview-container">
      <div class="email-frame" id="email-render-target">
        <!-- Rendered Email Injected Here -->
      </div>
    </div>
  </div>

  <div id="toast" class="toast">Copied rich email to clipboard! Paste directly into Gmail.</div>

  <script>
    let currentTemplate = 'advance';

    function setTemplate(type, btn) {
      currentTemplate = type;
      document.querySelectorAll('.tmpl-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const senderBadge = document.getElementById('recommended-sender');
      if (type === 'delivery') {
        senderBadge.innerText = 'Dev <dev@nexray.in>';
      } else if (type === 'feedback') {
        senderBadge.innerText = 'Support Nexray <support@nexray.in>';
      } else {
        senderBadge.innerText = 'Info Nexray <info@nexray.in>';
      }
      renderEmail();
    }

    function renderEmail() {
      const clientName = document.getElementById('var-client-name').value;
      const projectTitle = document.getElementById('var-project-title').value;
      const totalPrice = document.getElementById('var-total-price').value;
      const advancePaid = document.getElementById('var-advance-paid').value;
      const balanceDue = document.getElementById('var-balance-due').value;
      const upiId = document.getElementById('var-upi-id').value;
      const downloadLink = document.getElementById('var-download-link').value;
      const customNote = document.getElementById('var-custom-note').value;

      let html = '';

      if (currentTemplate === 'advance') {
        html = `
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #0f172a; line-height: 1.6;">
          <tr>
            <td style="padding: 18px 28px; border-bottom: 2px solid #0038FF;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td>
                    <span style="font-family: 'Arial Black', Impact, sans-serif; font-size: 20px; font-weight: 900; color: #0f172a; text-transform: uppercase;">NEX<span style="color: #0038FF;">RAY</span> // 3D</span>
                  </td>
                  <td align="right">
                    <span style="background-color: rgba(16, 185, 129, 0.1); color: #059669; font-size: 10px; font-weight: 800; padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.3);">ORDER CONFIRMED</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="background: linear-gradient(135deg, #0038FF 0%, #001A99 100%); padding: 26px 28px; text-align: center; color: #ffffff;">
              <div style="background-color: rgba(255, 255, 255, 0.15); color: #CCFF00; font-size: 10px; font-weight: 800; padding: 3px 12px; border-radius: 20px; display: inline-block; margin-bottom: 8px;">&bull; ADVANCE RECEIPT &amp; WORK COMMENCEMENT &bull;</div>
              <h2 style="margin: 0; font-family: 'Arial Black', Impact, sans-serif; font-size: 22px; text-transform: uppercase;">${projectTitle}</h2>
              <p style="margin: 4px 0 0 0; font-size: 13px; color: #cbd5e1;">Slot Locked &bull; Production Initiated</p>
            </td>
          </tr>
          <tr>
            <td style="padding: 28px;">
              <p style="margin: 0 0 14px 0; font-size: 15px; font-weight: 700;">Namaste ${clientName},</p>
              <p style="margin: 0 0 20px 0; font-size: 14px; color: #475569;">We have officially received your advance payment of <strong>&#8377;${advancePaid} INR</strong>. Your project slot is locked, and precision 3D CAD modeling is actively underway.</p>
              
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 20px; font-size: 13px;">
                <tr><td style="padding: 12px 16px; color: #64748b; border-bottom: 1px solid #e2e8f0;">Agreed Total Commission:</td><td style="padding: 12px 16px; font-weight: 800; text-align: right; border-bottom: 1px solid #e2e8f0;">&#8377;${totalPrice} INR</td></tr>
                <tr><td style="padding: 12px 16px; color: #16a34a; font-weight: 700; border-bottom: 1px solid #e2e8f0;">Advance Paid (Today):</td><td style="padding: 12px 16px; font-weight: 800; color: #16a34a; text-align: right; border-bottom: 1px solid #e2e8f0;">&#8377;${advancePaid} INR (Received)</td></tr>
                <tr><td style="padding: 12px 16px; color: #0038FF; font-weight: 800;">Balance Due on Final STL Dispatch:</td><td style="padding: 12px 16px; font-weight: 800; color: #0038FF; text-align: right;">&#8377;${balanceDue} INR</td></tr>
              </table>

              <p style="font-size: 13px; color: #475569; margin-bottom: 20px;"><strong>Engineering Guarantee:</strong> ${customNote}</p>

              <p style="margin: 0; font-size: 13px; font-weight: 800; color: #0038FF;">Nexray 3D Atelier &bull; info@nexray.in</p>
            </td>
          </tr>
          <tr>
            <td style="background-color: #0f172a; padding: 18px; text-align: center; color: #94a3b8; font-size: 11px;">
              Official Studio: <a href="https://studio.nexray.in" style="color: #CCFF00; text-decoration: none; font-weight: 700;">studio.nexray.in</a> &bull; Bangalore, India
            </td>
          </tr>
        </table>`;
      } else if (currentTemplate === 'delivery') {
        html = `
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #0f172a; line-height: 1.6;">
          <tr>
            <td style="padding: 18px 28px; border-bottom: 2px solid #0038FF;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td>
                    <span style="font-family: 'Arial Black', Impact, sans-serif; font-size: 20px; font-weight: 900; color: #0f172a; text-transform: uppercase;">NEX<span style="color: #0038FF;">RAY</span> // 3D</span>
                  </td>
                  <td align="right">
                    <span style="background-color: rgba(0, 56, 255, 0.08); color: #0038FF; font-size: 10px; font-weight: 800; padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(0, 56, 255, 0.25);">OFFICIAL DISPATCH</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="background: linear-gradient(135deg, #0038FF 0%, #001A99 100%); padding: 26px 28px; text-align: center; color: #ffffff;">
              <div style="background-color: rgba(255, 255, 255, 0.15); color: #CCFF00; font-size: 10px; font-weight: 800; padding: 3px 12px; border-radius: 20px; display: inline-block; margin-bottom: 8px;">&bull; PRODUCTION ASSET DELIVERY &bull;</div>
              <h2 style="margin: 0; font-family: 'Arial Black', Impact, sans-serif; font-size: 22px; text-transform: uppercase;">${projectTitle}</h2>
              <p style="margin: 4px 0 0 0; font-size: 13px; color: #cbd5e1;">Slicer-Ready Binary STL &bull; Watertight Manifold</p>
            </td>
          </tr>
          <tr>
            <td style="padding: 28px;">
              <p style="margin: 0 0 14px 0; font-size: 15px; font-weight: 700;">Dear ${clientName},</p>
              <p style="margin: 0 0 20px 0; font-size: 14px; color: #475569;">Your 3D sculpture has completed all topological inspections (100% Watertight, 0 non-manifold edges, flat base at Z=0.00mm) and is ready for download.</p>
              
              <div style="text-align: center; margin: 28px 0;">
                <a href="${downloadLink}" style="background-color: #0038FF; color: #ffffff; text-decoration: none; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; padding: 14px 28px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 16px rgba(0, 56, 255, 0.35);">
                  Download Production 3D Package (.ZIP) &rarr;
                </a>
              </div>

              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 20px; font-size: 13px;">
                <tr><td style="padding: 10px 16px; color: #64748b; border-bottom: 1px solid #e2e8f0;">Remaining Balance Due:</td><td style="padding: 10px 16px; font-weight: 800; color: #0038FF; text-align: right; border-bottom: 1px solid #e2e8f0;">&#8377;${balanceDue} INR</td></tr>
                <tr><td style="padding: 10px 16px; color: #64748b;">Pay via UPI VPA:</td><td style="padding: 10px 16px; font-weight: 800; color: #0f172a; text-align: right;">${upiId}</td></tr>
              </table>

              <p style="font-size: 13px; color: #475569;">Technical Notes: ${customNote}</p>
              <p style="margin-top: 16px; font-size: 13px; font-weight: 800; color: #0038FF;">Dev Nexray &bull; dev@nexray.in</p>
            </td>
          </tr>
          <tr>
            <td style="background-color: #0f172a; padding: 18px; text-align: center; color: #94a3b8; font-size: 11px;">
              Official Studio: <a href="https://studio.nexray.in" style="color: #CCFF00; text-decoration: none; font-weight: 700;">studio.nexray.in</a> &bull; Bangalore, India
            </td>
          </tr>
        </table>`;
      } else if (currentTemplate === 'quote') {
        html = `
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #0f172a; line-height: 1.6;">
          <tr>
            <td style="padding: 18px 28px; border-bottom: 2px solid #0038FF;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td><span style="font-family: 'Arial Black', Impact, sans-serif; font-size: 20px; font-weight: 900; color: #0f172a; text-transform: uppercase;">NEX<span style="color: #0038FF;">RAY</span> // 3D</span></td>
                  <td align="right"><span style="background-color: rgba(0, 56, 255, 0.08); color: #0038FF; font-size: 10px; font-weight: 800; padding: 4px 12px; border-radius: 20px;">OFFICIAL ESTIMATE</span></td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="background: linear-gradient(135deg, #0038FF 0%, #001A99 100%); padding: 26px 28px; text-align: center; color: #ffffff;">
              <div style="background-color: rgba(255, 255, 255, 0.15); color: #CCFF00; font-size: 10px; font-weight: 800; padding: 3px 12px; border-radius: 20px; display: inline-block; margin-bottom: 8px;">&bull; COMMISSION PROPOSAL &bull;</div>
              <h2 style="margin: 0; font-family: 'Arial Black', Impact, sans-serif; font-size: 22px; text-transform: uppercase;">${projectTitle}</h2>
              <p style="margin: 4px 0 0 0; font-size: 13px; color: #cbd5e1;">All-Inclusive Production Estimate</p>
            </td>
          </tr>
          <tr>
            <td style="padding: 28px;">
              <p style="margin: 0 0 14px 0; font-size: 15px; font-weight: 700;">Dear ${clientName},</p>
              <p style="margin: 0 0 20px 0; font-size: 14px; color: #475569;">Thank you for reaching out to Nexray 3D. We have evaluated your commission specifications. Here is your commercial quote:</p>
              
              <div style="background-color: #f8fafc; border: 2px solid #0038FF; border-radius: 10px; padding: 18px; margin-bottom: 20px;">
                <div style="font-size: 11px; font-weight: 800; color: #64748b; text-transform: uppercase;">Fixed Total Investment</div>
                <div style="font-size: 28px; font-weight: 900; color: #0038FF; font-family: 'Arial Black', sans-serif;">&#8377;${totalPrice} INR</div>

    async function copyFormattedEmail() {
      const emailHtml = document.getElementById('email-render-target').innerHTML;
      try {
        const blob = new Blob([emailHtml], { type: 'text/html' });
        const textBlob = new Blob([document.getElementById('email-render-target').innerText], { type: 'text/plain' });
        const item = new ClipboardItem({
          'text/html': blob,
          'text/plain': textBlob
        });
        await navigator.clipboard.write([item]);
        showToast("Copied rich styled email! Press Ctrl+V in Gmail.");
      } catch (err) {
        // Fallback for older clipboard API
        const target = document.getElementById('email-render-target');
        const range = document.createRange();
        range.selectNode(target);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        document.execCommand('copy');
        window.getSelection().removeAllRanges();
        showToast("Copied rich styled email! Press Ctrl+V in Gmail.");
      }
    }

    function copyRawHtml() {
      const emailHtml = document.getElementById('email-render-target').innerHTML;
      navigator.clipboard.writeText(emailHtml).then(() => {
        showToast("Copied Raw HTML code to clipboard!");
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3500);
    }

    // Initial render
    renderEmail();
  </script>
